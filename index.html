<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Hypha Lab: a mycology game. Choose the feeding mode, spore-producing structure, dispersal and key structure that let a fungus survive six real habitats.">
<meta property="og:type" content="website">
<meta property="og:title" content="Hypha Lab">
<meta property="og:description" content="Build a fungus that survives. Match feeding, spores and structures to each habitat.">
<meta property="og:url" content="https://phdiassantos.github.io/hypha-lab/">
<meta property="og:image" content="https://phdiassantos.github.io/hypha-lab/cover.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="author" content="Pedro H. D. Santos, LSU Alexandria">

<title>Hypha Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a living diorama (canvas) on the left that grows the fungus as you choose traits; the field notebook on the right. Stacks on phones with the diorama pinned on top. Single dark "forest floor at dusk" world by choice. */
:root{
  --bg:#0D1310; --panel:#151E19; --panel2:#1C2821; --ink:#EEEADF; --muted:#9AA89D; --line:#28362E;
  --amber:#E9B44C; --amber-soft:rgba(233,180,76,.13); --moss:#A6C682;
  --good:#7DC890; --part:#E9B44C; --bad:#EA8B7B;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --serif:"Instrument Serif", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.05;letter-spacing:-.015em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sci{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:0}

.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.02em}
.brand svg{width:26px;height:26px}
.pill{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill b{color:var(--amber);font-weight:500}

.play{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){
  .play.two{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}
  .play.two .stage{position:sticky;top:16px}
}
.stage{display:flex;flex-direction:column;gap:8px;min-width:0}
@media (max-width:899px){
  .stage.stick{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);padding-block:4px 10px}
}
.frame{position:relative;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line),0 24px 48px -24px rgba(0,0,0,.8)}
canvas{display:block;width:100%;aspect-ratio:640/440;max-width:100%;transition:filter 2.6s ease}
.stage.wither canvas{filter:saturate(.25) brightness(.72) sepia(.3)}
.cap{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);background:rgba(10,15,12,.74);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.09);border-radius:9px;padding:6px 11px 7px;font-size:13.5px;line-height:1.3;color:#EEEADF;font-weight:600}
.cap .k{display:block;font-family:var(--mono);font-weight:500;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--amber);margin-bottom:1px}
.cap.show{animation:capIn .55s cubic-bezier(.2,1.2,.4,1) both}
@keyframes capIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.chip{border:1px solid var(--line);border-radius:9px;padding:6px 8px 7px;background:var(--panel);min-width:0}
.chip .k{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip .v{display:block;font-size:12.5px;line-height:1.2;font-weight:600;color:var(--muted);overflow-wrap:break-word;hyphens:auto}
@media (max-width:480px){.chip{padding:5px 6px 6px}.chip .k{font-size:8.5px;letter-spacing:.05em}.chip .v{font-size:11px}.cap{left:8px;bottom:8px;padding:4px 8px 5px;font-size:12px}.cap .k{font-size:9px}}
.chip.set{border-color:rgba(233,180,76,.4)}
.chip.set .k{color:var(--amber)}
.chip.set .v{color:var(--ink)}
.chip.cur{box-shadow:inset 0 0 0 1px var(--amber)}
.chip.pop{animation:pop .6s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:none}}

.col{display:flex;flex-direction:column;gap:18px;min-width:0}
/* home */
.hero{display:flex;flex-direction:column;gap:12px}
.hero h1{font-size:clamp(36px,5.2vw,56px);font-weight:800}
.hero h1 .sci{font-size:1.12em;color:var(--amber)}
.hero p{color:var(--muted);max-width:56ch}
.how{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.how li{border-top:2px solid var(--amber);padding-top:7px;font-size:13px;line-height:1.35;color:var(--muted)}
.how b{display:block;color:var(--ink);font-weight:600;font-size:13.5px}
@media (max-width:480px){.how{grid-template-columns:repeat(2,minmax(0,1fr))}}
.missions{display:flex;flex-direction:column;gap:10px}
.mcard{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;width:100%;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px 8px 8px;transition:border-color .2s,transform .2s}
.mcard:hover{border-color:var(--amber);transform:translateY(-1px)}
.mcard img{width:104px;height:72px;object-fit:cover;border-radius:7px;display:block;background:var(--panel2)}
.mcard h3{font-size:17px;font-weight:700}
.mcard .where{font-size:13px;color:var(--muted)}
.mcard .st{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.mcard .st.done{color:var(--good)}

/* mission */
.brief{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.brief .head{padding:14px 16px 12px;display:flex;flex-direction:column;gap:6px}
.brief h2{font-size:26px;font-weight:700}
.brief p{font-size:15px}
.cond{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.cond div{padding:8px 16px;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.35;min-width:0}
.cond div:nth-child(odd){border-right:1px solid var(--line)}
.cond div:nth-last-child(-n+2){border-bottom:0}
.cond .label{display:block;font-size:10px;margin-bottom:1px}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background .3s}
.steps span.on{background:var(--moss)}
.steps span.now{background:var(--amber)}
.q{display:flex;flex-direction:column;gap:4px}
.q h3{font-size:24px;font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 14px;min-width:0;transition:border-color .2s,background .2s}
.opt:hover{border-color:rgba(233,180,76,.6)}
.opt strong{font-weight:600;font-size:15px}
.tag{align-self:flex-start;font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid}
.tag.sx{color:#E7B6D6;border-color:rgba(231,182,214,.45);background:rgba(231,182,214,.08)}
.tag.ax{color:#9ED3D0;border-color:rgba(158,211,208,.45);background:rgba(158,211,208,.08)}
.cycle{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cycle div{display:flex;flex-direction:column;gap:5px;font-size:13.5px;line-height:1.4;background:var(--panel2);border-radius:9px;padding:9px 11px;min-width:0}
@media (max-width:480px){.cycle{grid-template-columns:1fr}}
.opt span{font-size:13.5px;color:var(--muted);line-height:1.4}
.opt.sel{border-color:var(--amber);background:var(--amber-soft);box-shadow:inset 0 0 0 1px var(--amber)}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:11px 20px;font-weight:700;font-size:15px}
.btn[disabled]{opacity:.3;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.grow{background:var(--amber);color:#1B1408}

/* result */
.scorehead{display:flex;align-items:center;gap:16px}
.ring{width:92px;height:92px;flex:none}
.ring text{font-family:var(--display);font-weight:800;fill:var(--ink)}
.scorehead h2{font-size:26px;font-weight:700}
.scorehead p{color:var(--muted);font-size:14px;margin-top:4px}
.fb{display:flex;flex-direction:column;gap:10px}
.fbi{display:grid;grid-template-columns:28px minmax(0,1fr);gap:11px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.mark{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:500;color:#10160F}
.mark.g{background:var(--good)} .mark.p{background:var(--part)} .mark.b{background:var(--bad)}
.fbi .t{font-size:14px;line-height:1.45}
.fbi .t b{font-weight:600}
.fbi .pts{font-family:var(--mono);font-size:12px;color:var(--muted);float:right;margin-left:8px;font-variant-numeric:tabular-nums}
.fbi .ans{display:block;margin-top:4px;color:var(--muted);font-size:13px}
.reveal{border:1px solid rgba(233,180,76,.5);border-radius:12px;background:linear-gradient(160deg,rgba(233,180,76,.09),transparent 60%),var(--panel);padding:16px;display:flex;flex-direction:column;gap:8px}
.reveal h3{font-family:var(--serif);font-style:italic;font-weight:400;font-size:34px;letter-spacing:0;color:var(--amber)}
.reveal .common{font-weight:600}
.reveal p.txt{font-size:14.5px}

/* final */
.final{max-width:620px;display:flex;flex-direction:column;gap:14px}
.final h2{font-size:clamp(36px,7vw,52px);font-weight:800}
.table{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.table div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.table div span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}
.foot{font-size:12.5px;color:var(--muted)}
.fade{animation:fade .4s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade,.cap.show,.chip.pop{animation:none}canvas{transition:none}}
.info{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px 14px 13px;display:flex;flex-direction:column;gap:7px}
.info h4{margin:0;font-family:var(--display);font-size:17px;line-height:1.2;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.info p{font-size:14.5px;line-height:1.5;color:var(--ink)}
.info p.muted{color:var(--muted)}
.info .look{font-size:13px;color:var(--muted)}
.info .look b{color:var(--amber);font-weight:600}
.hintb{align-self:flex-start;background:none;border:1px dashed rgba(233,180,76,.5);color:var(--amber);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.clue{border-left:3px solid var(--amber);padding:2px 0 2px 10px;font-size:14px!important;color:var(--ink)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.log li{display:flex;gap:10px;align-items:flex-start;opacity:0;animation:logIn .5s ease both;animation-delay:var(--d)}
.log li .mk{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#0D1310;margin-top:1px}
.log .mk.g{background:var(--good)}.log .mk.p{background:var(--part)}.log .mk.b{background:var(--bad)}
.log li div{font-size:13.5px;line-height:1.45;color:var(--muted)}
.log li b{color:var(--ink);font-weight:600}
.log .st{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin-left:6px}
.log .st.g{color:var(--good)}.log .st.p{color:var(--part)}.log .st.b{color:var(--bad)}
.log li.out{border-top:1px solid var(--line);padding-top:9px}
.log li.out div{color:var(--ink);font-size:14px}
@keyframes logIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.log li{animation:none;opacity:1}}
</style>
</head>
<body>


<div class="wrap">
  <header class="bar" id="bar"></header>
  <div class="play two" id="play">
    <div class="stage" id="stage">
      <div class="frame"><canvas id="cv" role="img" aria-label="Animated diorama of your fungus growing in its habitat"></canvas><div class="cap" id="cap" hidden></div></div>
      <div class="hud" id="hud"></div>
      <div class="info" id="info" hidden></div>
    </div>
    <main class="col" id="app"></main>
  </div>
</div>

<script>
/* ================= GAME DATA ================= */
const SLOTS=[
 {id:'feed',label:'Feeding',q:'How will your fungus get food?'},
 {id:'body',label:'Reproduction',q:'Which spore-producing structure will it make?'},
 {id:'move',label:'Dispersal',q:'How will its propagules travel?'},
 {id:'tool',label:'Key structure',q:'Which special structure does it need?'}
];
const OPTS={
 feed:[
  {id:'lignin',n:'White-rot saprotroph',d:'Lignin-modifying enzymes (lignin and manganese peroxidases, laccases) break down lignin along with cellulose in dead wood.'},
  {id:'fast',n:'Fast-growing saprotroph',d:'Grows quickly on simple sugars and easy nutrients, and finishes before competitors move in.'},
  {id:'ecm',n:'Ectomycorrhizal mutualist',d:'Hyphae sheathe tree root tips and trade soil water, nitrogen and phosphorus for the host’s photosynthates.'},
  {id:'biotroph',n:'Obligate biotroph',d:'Takes nutrients only from living host cells, keeps the host alive, and usually cannot grow on culture media.'},
  {id:'lichen',n:'Lichenized fungus',d:'Forms a thallus with a photobiont (green alga or cyanobacterium) that supplies sugars by photosynthesis.'},
  {id:'predator',n:'Nematophagous fungus',d:'Lives as a saprotroph but captures and digests nematodes for nitrogen when it runs short.'}],
 body:[
  {id:'gilled',n:'Gilled basidioma',sex:'Sexual',sp:'basidiospores',d:'A mushroom with lamellae (gills) under the pileus. Each basidium makes four basidiospores by meiosis.'},
  {id:'bracket',n:'Poroid basidioma (bracket)',sex:'Sexual',sp:'basidiospores',d:'A tough, shelf-like basidioma. The hymenophore is a layer of tubes, and basidiospores drop from the pores.'},
  {id:'truffle',n:'Hypogeous ascoma (truffle)',sex:'Sexual',sp:'ascospores',d:'A closed ascoma that forms underground. Asci with ascospores stay sealed inside and are never discharged.'},
  {id:'cup',n:'Apothecium (cup or disc)',sex:'Sexual',sp:'ascospores',d:'An open ascoma. Asci in the exposed hymenium burst and shoot their ascospores into the air.'},
  {id:'sporangium',n:'Sporangiophore and sporangium',sex:'Asexual',sp:'sporangiospores',d:'One tall hypha carries a sac of sporangiospores made by mitosis. They form inside the sac, so they are not conidia.'},
  {id:'pustule',n:'Conidiophores or uredinia',sex:'Asexual',sp:'conidia or urediniospores',d:'Conidiophores (free or in sporodochia), or rust uredinia, make huge numbers of mitotic spores fast, with no mating.'}],
 move:[
  {id:'wind',n:'Wind',d:'Small, dry spores (basidiospores, ascospores, conidia or urediniospores) carried by moving air.'},
  {id:'animals',n:'Mycophagous animals',d:'Volatile compounds lead animals to eat the fruiting body. Thick-walled spores pass through the gut and land in feces.'},
  {id:'explosive',n:'Discharge toward light',d:'Turgor pressure builds in a swollen cell until spores, or a whole sporangium, are shot off, aimed by phototropism.'},
  {id:'water',n:'Water',d:'Rain splash and soil water films move spores, especially conidia in slime or in soil pores.'},
  {id:'fragments',n:'Soredia and isidia',d:'Vegetative propagules: tiny pieces that hold both the fungal hyphae and the photobiont.'},
  {id:'insects',n:'Insects',d:'Spores in a foul-smelling slime (gleba) stick to flies that come to feed.'}],
 tool:[
  {id:'rhizomorphs',n:'Rhizomorphs',d:'Root-like cords of parallel hyphae with a melanized rind and a growing tip. They conduct water and nutrients through soil.'},
  {id:'hartig',n:'Mantle and Hartig net',d:'A hyphal sheath around the root tip, plus a net of hyphae between root cells that never enters them.'},
  {id:'haustoria',n:'Appressorium and haustoria',d:'The appressorium attaches and a penetration peg breaks the cuticle. Haustoria then press into living cells to absorb nutrients.'},
  {id:'walls',n:'Melanized, pigmented walls',d:'Melanin in hyphal and spore walls, and cortex pigments such as usnic acid, screen UV and resist drying out.'},
  {id:'fast',n:'Short life cycle',d:'Goes from spore to new sporangia in a few days.'},
  {id:'traps',n:'Adhesive hyphal networks',d:'Three-dimensional nets of sticky hyphal loops that catch nematodes. Trap hyphae then penetrate and digest them.'}]
};
const SEE={"feed": {"lignin": "Hyphae push into the wood and release enzymes outside their cells. Laccases and peroxidases break lignin apart, and the hyphae absorb the sugars freed from the cellulose. The wood turns pale and stringy: white rot.", "fast": "Hyphae race across the surface and absorb simple sugars right away. Growth is fast but shallow, so once the easy food is gone, the advantage is gone too.", "ecm": "Hyphae wrap the young root tips and spread far out into the soil. They pick up water, nitrogen and phosphorus and pass them to the root in exchange for sugar.", "biotroph": "Hyphae grow between the living host cells without killing them. The yellow halos show where the fungus is drawing nutrients out of those cells.", "lichen": "A lichen thallus forms. Fungal hyphae build the body and hold algal cells inside it. The algae photosynthesize and share their sugars with the fungus.", "predator": "Hyphae feed on dead plant material and build small loops when nematodes are near. A captured nematode becomes a nitrogen meal."}, "body": {"gilled": "Mushrooms rise from the mycelium. Their gills are lined with basidia. Inside each basidium the two nuclei fuse (karyogamy), meiosis follows, and four basidiospores form on tiny stalks called sterigmata. The zoomed view shows each step.", "bracket": "A tough shelf grows out sideways. Its underside is packed with tiny tubes lined with basidia, and the basidiospores drop out through the pores. A bracket can keep growing for years.", "truffle": "A closed ascoma grows underground. Inside, sealed asci hold ascospores made by meiosis. They are never shot out; they wait for an animal to dig them up.", "cup": "Open cups form. Their inner surface, the hymenium, is a palisade of asci. Each ascus holds eight ascospores made by meiosis and shoots them out of its tip.", "sporangium": "Stalks called sporangiophores rise, each with a clear swollen vesicle and a black sporangium on top. Inside the sporangium, sporangiospores form by mitosis. No mating is needed.", "pustule": "Masses of asexual spores form fast, with no mating. In a rust, uredinia burst through the leaf surface. In most other fungi, conidiophores carry conidia made by mitosis."}, "move": {"wind": "Tiny, dry spores leave the fruiting body and drift on the air. Most land somewhere useless, so the fungus makes them by the millions.", "animals": "The ripe fruiting body gives off a strong smell. An animal finds it, eats it, and later drops the spores in its feces somewhere new.", "explosive": "Water pressure builds in a swollen cell until it bursts and shoots the spores, or the whole sporangium, away. Watch where they land.", "water": "Raindrops hit the fungus and splash spores a short distance. In soil, spores drift through the water films between the particles.", "fragments": "Small pieces break off that hold fungal hyphae and algal cells together, so each piece can start a new lichen right where it lands.", "insects": "The spores sit in a smelly, sticky slime. Flies come to feed and fly off with spores stuck to their legs and bodies."}, "tool": {"rhizomorphs": "Thick, dark cords grow out through the soil toward new food. The black rind protects the hyphae inside, which carry water and nutrients along the cord.", "hartig": "The zoomed view shows a root in section: a mantle of hyphae over the surface, and the Hartig net between the root cells. Sugar (orange) moves to the fungus; phosphorus and water (blue) move to the plant.", "haustoria": "The zoomed view shows the infection: a spore germinates, forms an appressorium, pushes a penetration peg through the cuticle, and haustoria form inside the living cells.", "walls": "The zoomed view shows a cell with a dark, pigmented wall. The pigment blocks UV, and the cell can dry out completely and revive when it gets wet again.", "fast": "The dial in the zoomed view counts the days: spore, germ tube, mycelium, new sporangia. The whole life cycle takes only a few days.", "traps": "The zoomed view shows sticky hyphal loops. A nematode swims in and gets stuck, and the fungus grows into it and digests it."}};

function root(c,p,w){c.lineCap='round';c.beginPath();c.moveTo(...p[0]);c.bezierCurveTo(...p[1],...p[2],...p[3]);

  circ(c,0,0,r);c.fillStyle=rg(c,-r*.35,-r*.4,1,0,0,r*1.1,[[0,'#8E6A4C'],[.55,'#4A3122'],[1,'#1E120A']]);c.fill();
  const R=rng(9);for(let i=0;i<54;i++){const a=R()*TAU,d=Math.sqrt(R())*r*.92,x=Math.cos(a)*d,y=Math.sin(a)*d,s=2+R()*2.2;c.beginPath();c.moveTo(x,y-s);c.lineTo(x+s,y);c.lineTo(x,y+s*.8);c.lineTo(x-s,y);c.closePath();c.fillStyle=`rgba(${110+R()*40},${80+R()*30},${55+R()*20},.85)`;c.fill();c.fillStyle='rgba(255,230,190,.25)';c.beginPath();c.moveTo(x,y-s);c.lineTo(x+s,y);c.lineTo(x,y);c.fill()}

function genHy(h,f){const R=rng(ST.hab.length*97+f.length*13+5),[x0,y0,x1,y1]=h.box,ok=(x,y)=>x>x0&&x<x1&&y>y0&&y<y1&&(!h.ok||h.ok(x,y));
  const n=f==='fast'?760:560,segs=[];let tips=[];const [ox,oy]=h.origin;for(let i=0;i<7;i++)tips.push({x:ox,y:oy,a:i/7*TAU});let guard=0;
  while(segs.length<n&&tips.length&&guard++<400){const next=[];
   for(const tp of tips){let a=tp.a+(R()-.5)*.7;const L=5+R()*4;let nx=tp.x+Math.cos(a)*L,ny=tp.y+Math.sin(a)*L,tries=0;
    while(!ok(nx,ny)&&tries<6){a+=Math.PI*(.35+R()*.5);nx=tp.x+Math.cos(a)*L;ny=tp.y+Math.sin(a)*L;tries++}
    if(!ok(nx,ny))continue;segs.push([tp.x,tp.y,nx,ny]);next.push({x:nx,y:ny,a});
    if(R()<.17)next.push({x:nx,y:ny,a:a+(R()<.5?-1:1)*(.6+R()*.5)});if(segs.length>=n)break}
   tips=next.length>80?next.filter((_,i)=>i%2===0||R()<.6).slice(0,80):next}
  return segs}

function drawFeed(c){const f=ST.traits.feed,a=age('feed');if(!f||a<0)return;const h=HB();
  if(f==='lichen'){drawThallus(c,h.origin[0],h.origin[1]+4,ease(a/2.4));return}
  const sty={lignin:['#F4ECD8',1.15,2.4],fast:['#FFFFFF',.9,1.1],ecm:['#EED9AC',1.2,2.4],biotroph:['#F8F2C2',.95,2.2],predator:['#F3F1E9',1.05,2.2]}[f];

  if(f==='biotroph'){const R=rng(3);for(let i=0;i<26*p;i++){const [x,y]=h.patchPt?h.patchPt(R):[0,0];circ(c,x,y,7);c.fillStyle='rgba(230,215,100,.22)';c.fill()}}

  c.globalAlpha=.85;
  if(f==='predator'){c.strokeStyle='#FFFFFF';c.lineWidth=1;for(let i=17;i<n;i+=37){circ(c,s[i][2],s[i][3],3.6);c.stroke()}}
  if(f==='fast'){c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=.7;for(let i=11;i<n;i+=23){const [,,x,y]=s[i];for(let k=0;k<5;k++){const an=k*1.25+i;c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.cos(an)*4,y+Math.sin(an)*4);c.stroke()}}}
  if(f==='ecm'){c.globalAlpha=1;circ(c,h.origin[0],h.origin[1],26*p);c.fillStyle=rg(c,h.origin[0],h.origin[1],2,h.origin[0],h.origin[1],26*p+1,[[0,'rgba(245,225,175,.5)'],[1,'rgba(245,225,175,0)']]);c.fill()}

function drawRhizo(c){if(ST.traits.tool!=='rhizomorphs')return;const a=age('tool');if(a<0)return;const h=HB(),[bx,by]=h.rbase,p=ease(a/2.8);

   const pj=clamp(p*1.15-j*.08);for(let i=0;i<=40*pj;i++)pts.push(bz(cp,i/40));if(pts.length<2)return;

function drawBody(c){const b=ST.traits.body,a=age('body'),h=HB();ST.src={x:h.origin[0],y:h.origin[1]};if(!b||a<0)return;const g=clamp(a/1.7),bs=h.bs,dr=ST.droop;

function hud(){hudEl.innerHTML=SLOTS.map((s,i)=>{const v=S.pick[s.id];return`<div class="chip ${v?'set':''} ${S.view==='mission'&&i===S.step?'cur':''} ${popSlot===s.id?'pop':''}"><span class="k">${s.label}</span><span class="v">${v?opt(s.id,v).n:'Not chosen'}</span></div>`}).join('');popSlot=null}
const BRAND=`<svg viewBox="0 0 26 26" aria-hidden="true"><path d="M3 13 Q13 0 23 13 Q13 10.5 3 13Z" fill="#E9B44C"/><path d="M11 12.6 L10.4 23 L15.6 23 L15 12.6Z" fill="#EEEADF"/><path d="M4 24.5 Q9 21 13 23.5 Q17 21 22 24.5" stroke="#A6C682" stroke-width="1.3" fill="none"/></svg>`;
function bar(){document.getElementById('bar').innerHTML=`<button class="brand" data-a="home" aria-label="Hypha Lab home">${BRAND}Hypha Lab</button><span class="pill"><b>${Object.keys(S.scores).length}</b>/${M.length} habitats · ${total()} pts</span>`}

function home(){thumbs();return`<section class="hero fade"><span class="label">A mycology field game</span>
  <h1>Grow a fungus that <span class="sci">survives.</span></h1>
  <p>Every habitat poses a problem. Pick how your fungus feeds, where it makes spores, how those spores travel, and the one structure that gives it an edge. Watch it grow, then meet the real fungus that solved the same problem.</p></section>
  <ol class="how">${SLOTS.map(s=>`<li><b>${s.label}</b>${s.q.replace('your fungus ','it ').replace('its ','')}</li>`).join('')}</ol>
  <div class="missions">${M.map((m,i)=>{const sc=S.scores[m.id];return`<button class="mcard" data-a="start" data-i="${i}"><img src="${THUMBS[m.id]}" alt=""><span><span class="label">Habitat ${pad(i)}</span><h3>${m.name}</h3><span class="where">${m.where}</span></span><span class="st ${sc!=null?'done':''}">${sc!=null?sc+'/100':'Play'}</span></button>`}).join('')}</div>
  ${Object.keys(S.scores).length===M.length?`<button class="btn grow" data-a="final">See your final rank</button>`:''}
  <p class="foot">Six habitats, about two minutes each. Your scores are saved in this browser.</p>`}
function mission(){const m=M[S.m],sl=SLOTS[S.step],ch=S.pick[sl.id],last=S.step===3;
  return`<article class="brief"><div class="head"><span class="label">Habitat ${pad(S.m)} · ${m.where}</span><h2>${m.name}</h2><p>${m.brief}</p></div>
   <div class="cond">${m.cond.map(([k,v])=>`<div><span class="label">${k}</span>${v}</div>`).join('')}</div></article>
  <div class="steps">${SLOTS.map((s,i)=>`<span class="${i===S.step?'now':S.pick[s.id]?'on':''}"></span>`).join('')}</div>
  <div class="q"><span class="label">Trait ${S.step+1} of 4 · ${sl.label}</span><h3>${sl.q}</h3></div>
  <div class="opts">${OPTS[sl.id].map(o=>`<button class="opt ${ch===o.id?'sel':''}" data-a="pick" data-v="${o.id}" aria-pressed="${ch===o.id}">${o.sex?`<em class="tag ${o.sex==='Sexual'?'sx':'ax'}">${o.sex} · ${o.sp}</em>`:''}<strong>${o.n}</strong><span>${o.d}</span></button>`).join('')}</div>
  <div class="nav"><button class="btn ghost" data-a="back">${S.step===0?'All habitats':'Back'}</button>${last?`<button class="btn grow" data-a="grow" ${ch?'':'disabled'}>Grow it</button>`:`<button class="btn" data-a="next" ${ch?'':'disabled'}>Next trait</button>`}</div>`}
function ringSvg(v){const r=38,c=2*Math.PI*r,col=v>=75?'var(--good)':v>=45?'var(--part)':'var(--bad)';return`<svg class="ring" viewBox="0 0 92 92"><circle cx="46" cy="46" r="${r}" fill="none" stroke="var(--line)" stroke-width="7"/><circle cx="46" cy="46" r="${r}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}" transform="rotate(-90 46 46)"/><text x="46" y="55" text-anchor="middle" font-size="26">${v}</text></svg>`}
function result(){const m=M[S.m],g=grade(m,S.pick),v=g.reduce((a,b)=>a+b.pts,0),next=M.findIndex((x,i)=>i>S.m&&S.scores[x.id]==null),all=Object.keys(S.scores).length===M.length;
  const verdict=v>=90?'Your fungus thrives here.':v>=65?'It survives, with a few weak spots.':v>=40?'It struggles to hang on.':'It would not last a week here.';
  return`<div class="scorehead fade">${ringSvg(v)}<div><span class="label">${m.name}</span><h2>${verdict}</h2><p>${g.filter(x=>x.kind==='g').length} of 4 traits match the real solution.</p></div></div>
  <div class="fb">${g.map(x=>`<div class="fbi"><span class="mark ${x.kind}" aria-hidden="true">${x.kind==='g'?'✓':x.kind==='p'?'~':'✕'}</span><div class="t"><span class="pts">+${x.pts}</span><b>${x.slot.label}: ${opt(x.slot.id,x.c).n}.</b> ${x.text}${x.best?`<span class="ans">Best fit: ${opt(x.slot.id,x.best).n}</span>`:''}</div></div>`).join('')}</div>
  <section class="reveal"><span class="label">The real fungus · ${m.r.group}</span><h3>${m.r.sci}</h3><span class="common">${m.r.common}</span><div class="cycle"><div><span class="tag sx">Sexual</span>${m.r.sex}</div><div><span class="tag ax">Asexual</span>${m.r.asex}</div></div><p class="txt">${m.r.text}</p></section>
  <div class="nav"><button class="btn ghost" data-a="retry">Try again</button>${next>=0?`<button class="btn" data-a="start" data-i="${next}">Next habitat</button>`:all?`<button class="btn grow" data-a="final">Final rank</button>`:`<button class="btn" data-a="home">All habitats</button>`}</div>`}
function final(){const avg=Math.round(total()/M.length);return`<div class="final fade"><span class="label">Field season complete · average ${avg}/100</span><h2>${rank(avg)}</h2>
  <p>${avg>=70?'You read each habitat and matched fungal structures to the problem it posed. That is how mycologists think about form and function.':'Replay any habitat and read the feedback. Each trait choice is a hypothesis about what the environment demands.'}</p>
  <div class="table">${M.map(m=>`<div><span>${m.name} · <span class="sci">${m.r.sci}</span></span><span>${S.scores[m.id]??'–'}</span></div>`).join('')}</div>
  <div class="nav"><button class="btn ghost" data-a="reset">Start over</button><button class="btn" data-a="home">All habitats</button></div></div>`}

const NARROW=matchMedia('(max-width:899px)');
function firstSentence(t){const m=t.match(/^.*?[.!?](\s|$)/);return m?m[0].trim():t}
function infoHTML(){const v=S.view;
  if(v==='mission'){const m=M[S.m],sl=SLOTS[S.step],ch=S.pick[sl.id],o=ch&&opt(sl.id,ch),hk=S.m+'-'+S.step,shown=S.hint&&S.hint[hk];
   return`<span class="label">What's happening</span>${o?`<h4>${o.n}${o.sex?`<em class="tag ${o.sex==='Sexual'?'sx':'ax'}">${o.sex} · ${o.sp}</em>`:''}</h4><p>${SEE[sl.id][ch]}</p><p class="look">Look for the <b>labels</b> on the scene${sl.id==='body'||sl.id==='tool'?' and the <b>zoomed view</b>':''}. Not sure it fits this habitat? Try another option and compare.</p>`:`<p class="muted">Pick a ${sl.label.toLowerCase()} trait. Your fungus grows it in the scene, with labels${sl.id==='body'||sl.id==='tool'?' and a zoomed-in view':''}, so you can see what it does before you commit.</p>`}
   <button class="hintb" data-a="hint">${shown?'Hide the clue':'Need a clue about this habitat?'}</button>${shown?`<p class="clue">${m.s[sl.id].miss}</p>`:''}`}
  if(v==='result'){const m=M[S.m],g=grade(m,S.pick),sc=g.reduce((a,b)=>a+b.pts,0),d=[.2,1.1,2.3,2.9],weak=g.filter(x=>x.kind==='b').map(x=>x.slot.label.toLowerCase()),st={g:'fits',p:'partly fits',b:'does not fit'};
   return`<span class="label">Growing season · what happened</span><ol class="log">${g.map((x,i)=>`<li style="--d:${d[i]}s"><span class="mk ${x.kind}">${x.kind==='g'?'✓':x.kind==='p'?'~':'✕'}</span><div><b>${x.slot.label}: ${opt(x.slot.id,x.c).n}</b><em class="st ${x.kind}">${st[x.kind]}</em><br>${firstSentence(SEE[x.slot.id][x.c])}</div></li>`).join('')}
   <li class="out" style="--d:3.8s"><div><b>Outcome ${sc}/100.</b> ${g.filter(x=>x.kind==='g').length} of 4 traits fit ${m.name.toLowerCase()}.${weak.length?` Weakest link: ${weak.join(' and ')}. Read why on the ${NARROW.matches?'feedback below':'right'}.`:' Every piece works together.'}</div></li></ol>`}
  return''}
function demo(){resetStage('stump');S.pick={};const n=performance.now();ST.traits={feed:'lignin',body:'gilled',move:'wind',tool:'rhizomorphs'};ST.t0={feed:n+300,body:n+1500,move:n+2900,tool:n+3500};showCap('Preview · Habitat 01','A wood decomposer fruiting on an oak stump')}
function render(){bar();const v=S.view,app=document.getElementById('app');
  stageEl.hidden=v==='final';document.getElementById('play').className='play'+(v==='final'?'':' two');
  stageEl.classList.toggle('stick',v==='mission');hudEl.hidden=v==='home';
  app.innerHTML=({home,mission,result,final})[v]();if(v!=='home')hud();
  const ih=infoHTML(),ie=document.getElementById('info');ie.hidden=!ih||NARROW.matches;ie.innerHTML=NARROW.matches?'':ih;
  if(ih&&NARROW.matches){const an=app.querySelector(v==='mission'?'.q':'.scorehead');if(an)an.insertAdjacentHTML('afterend',`<div class="info">${ih}</div>`)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,sl=SLOTS[S.step];let top=true;
  if(a==='home'){S.view='home';demo()}
  else if(a==='start'){S.m=+b.dataset.i;S.step=0;S.pick={};S.view='mission';resetStage(M[S.m].id)}
  else if(a==='pick'){const v=b.dataset.v;top=false;S.pick[sl.id]=v;popSlot=sl.id;setTrait(sl.id,v);{const o=opt(sl.id,v);showCap(sl.label+(o.sex?' · '+o.sex+' · '+o.sp:''),o.n)}}
  else if(a==='next'){S.step++;top=false}
  else if(a==='hint'){S.hint=S.hint||{};const hk=S.m+'-'+S.step;S.hint[hk]=!S.hint[hk];top=false}
  else if(a==='back'){if(S.step===0){S.view='home';demo()}else{S.step--;top=false}}
  else if(a==='grow'){const m=M[S.m],v=grade(m,S.pick).reduce((x,y)=>x+y.pts,0);S.scores[m.id]=Math.max(v,S.scores[m.id]??0);save();S.view='result';replay();showCap('Growing season','Watching your fungus develop');
   const hab=m.id;setTimeout(()=>{if(S.view!=='result'||ST.hab!==hab)return;ST.health=v;ST.droopT=v<50?1:0;stageEl.classList.toggle('wither',v<50);showCap('Outcome · '+v+'/100',v>=75?'Thriving and spreading':v>=50?'Hanging on':'Withering away')},RM?50:3600)}
  else if(a==='retry'){S.step=0;S.pick={};S.view='mission';resetStage(M[S.m].id)}
  else if(a==='final'){S.view='final'}
  else if(a==='reset'){S.scores={};save();S.view='home';demo()}
  render();
  if(top)window.scrollTo({top:0,behavior:'instant'});
  else if(a==='next'||a==='back'){const q=document.querySelector('.q');if(q&&q.getBoundingClientRect().top<0)q.scrollIntoView({block:'center'})}
});
function start(data){load();if(data&&data.view){S=Object.assign(S,data)}if(S.view==='home')demo();else if(S.view!=='final'){resetStage(M[S.m].id);Object.entries(S.pick).forEach(([k,v])=>setTrait(k,v,-9999))}render()}
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body>
</html>
